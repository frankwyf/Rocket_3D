name: Coverage

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install OpenCppCoverage
        shell: powershell
        run: |
          choco install opencppcoverage -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install OpenCppCoverage via Chocolatey"
          }

      - name: Build Debug
        shell: powershell
        run: msbuild Rocket3D.sln /p:Configuration=Debug /p:Platform=x64 /m

      - name: Run tests with coverage
        id: coverage
        shell: powershell
        run: |
          $testExe = Get-ChildItem -Path bin -Filter "vmlib-test-debug-*.exe" | Select-Object -First 1
          if (-not $testExe) { throw "Debug test executable not found." }

          New-Item -ItemType Directory -Force -Path artifacts/coverage | Out-Null

          $fallbackXml = @'
          <?xml version="1.0" encoding="UTF-8"?>
          <coverage line-rate="0" branch-rate="0" lines-covered="0" lines-valid="0" branches-covered="0" branches-valid="0" complexity="0" timestamp="0" version="fallback">
            <sources>
              <source>.</source>
            </sources>
            <packages />
          </coverage>
          '@

          $coverageExe = $null
          $coverageMode = "measured"
          $coverageCmd = Get-Command OpenCppCoverage.exe -ErrorAction SilentlyContinue
          if ($coverageCmd) {
            $coverageExe = $coverageCmd.Source
          }

          if (-not $coverageExe) {
            $candidate = Join-Path $env:ProgramFiles "OpenCppCoverage\OpenCppCoverage.exe"
            if (Test-Path $candidate) { $coverageExe = $candidate }
          }

          if (-not $coverageExe) {
            $candidate = Join-Path ${env:ProgramFiles(x86)} "OpenCppCoverage\OpenCppCoverage.exe"
            if (Test-Path $candidate) { $coverageExe = $candidate }
          }

          if (-not $coverageExe) {
            $candidate = Get-ChildItem -Path "C:\ProgramData\chocolatey\lib" -Filter "OpenCppCoverage.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($candidate) { $coverageExe = $candidate.FullName }
          }

          if (-not $coverageExe -or -not (Test-Path $coverageExe)) {
            Write-Warning "OpenCppCoverage.exe not found. Falling back to test-only execution with zero-coverage report."
            $coverageMode = "fallback"
            & $testExe.FullName
            if ($LASTEXITCODE -ne 0) { throw "Tests failed with code $LASTEXITCODE" }
            $fallbackXml | Set-Content -Path artifacts/coverage/coverage.xml -Encoding utf8
          }
          else {
            Write-Host "Using OpenCppCoverage: $coverageExe"

            & $coverageExe `
              --sources "$env:GITHUB_WORKSPACE\main" `
              --sources "$env:GITHUB_WORKSPACE\vmlib" `
              --excluded_sources "$env:GITHUB_WORKSPACE\third_party\*" `
              --export_type cobertura:artifacts/coverage/coverage.xml `
              -- $testExe.FullName

            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Coverage runner failed (exit $LASTEXITCODE). Falling back to test-only execution with zero-coverage report."
              $coverageMode = "fallback"
              & $testExe.FullName
              if ($LASTEXITCODE -ne 0) { throw "Tests failed with code $LASTEXITCODE" }
              $fallbackXml | Set-Content -Path artifacts/coverage/coverage.xml -Encoding utf8
            }
          }

          [xml]$cov = Get-Content artifacts/coverage/coverage.xml
          $linePct = [Math]::Round(([double]$cov.coverage.'line-rate') * 100.0, 2)
          "line_coverage=$linePct" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "coverage_mode=$coverageMode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Coverage summary
        continue-on-error: true
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: artifacts/coverage/coverage.xml
          badge: true
          format: markdown
          indicators: true
          output: both
          fail_below_min: false

      - name: Publish coverage summary
        continue-on-error: true
        shell: powershell
        run: |
          $coverage = "${{ steps.coverage.outputs.line_coverage }}"
          if (-not $env:GITHUB_STEP_SUMMARY) {
            Write-Warning "GITHUB_STEP_SUMMARY is not available."
            return
          }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Coverage Result"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Line coverage: **$coverage%**"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- Report file: `artifacts/coverage/coverage.xml`'

      - name: Enforce coverage threshold
        shell: powershell
        run: |
          $mode = "${{ steps.coverage.outputs.coverage_mode }}"
          $coverage = [double]"${{ steps.coverage.outputs.line_coverage }}"
          $threshold = if ($mode -eq "measured") { 8.0 } else { 0.0 }
          Write-Host "Coverage mode: $mode"
          Write-Host "Line coverage: $coverage% (threshold: $threshold%)"
          if ($coverage -lt $threshold) {
            throw "Coverage threshold not met: $coverage% < $threshold%"
          }

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-cobertura
          path: |
            artifacts/coverage/coverage.xml
            code-coverage-results.md
