name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build ${{ matrix.configuration }}
        shell: powershell
        run: msbuild Rocket3D.sln /p:Configuration=${{ matrix.configuration }} /p:Platform=x64 /m

      - name: Run unit tests (${{ matrix.configuration }})
        shell: powershell
        run: |
          $config = "${{ matrix.configuration }}".ToLowerInvariant()
          $testExe = Get-ChildItem -Path bin -Filter "vmlib-test-$config-*.exe" | Select-Object -First 1
          if (-not $testExe) { throw "$config test executable not found." }
          New-Item -ItemType Directory -Force -Path artifacts/test-results | Out-Null
          & $testExe.FullName --reporter junit --out "artifacts/test-results/$config-tests.xml"
          if ($LASTEXITCODE -ne 0) { throw "$config tests failed with code $LASTEXITCODE" }

      - name: Upload test reports (${{ matrix.configuration }})
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-${{ matrix.configuration }}
          path: artifacts/test-results/*.xml

      - name: Upload executable artifact (${{ matrix.configuration }})
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rocket3d-bin-${{ matrix.configuration }}
          path: |
            bin/main-*.exe
            bin/vmlib-test-*.exe

      - name: Publish CI summary (${{ matrix.configuration }})
        if: always()
        shell: powershell
        run: |
          if (-not $env:GITHUB_STEP_SUMMARY) { return }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## CI Matrix Result - ${{ matrix.configuration }}"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Build: completed"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Unit tests: completed"
